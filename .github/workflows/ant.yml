name: Java CI with Ant Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download JUnit & Hamcrest JARs
      run: |
        mkdir -p lib
        curl -sL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -sL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Compile and Test
      run: |
        mkdir -p build/classes build/test/classes test-results
        javac -cp "lib/*" -d build/classes $(find src -name "*.java")
        javac -cp "build/classes:lib/*" -d build/test/classes $(find test -name "*.java")
        java -cp "build/classes:build/test/classes:lib/*" org.junit.runner.JUnitCore medicare.HospitalManagementSystemTest

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: "test-results/**/*.xml"