name: Java CI with Ant Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Dependencies
      run: |
        mkdir -p lib build/classes build/test/classes build/test/results
        curl -sL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -sL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Compile Classes
      run: |
        javac -cp "lib/*" -d build/classes $(find src -name "*.java")
        javac -cp "build/classes:lib/*" -d build/test/classes $(find test -name "*.java")

    - name: Execute Tests and Output XML
      run: |
        java -cp "build/classes:build/test/classes:lib/*" org.junit.runner.JUnitCore medicare.HospitalManagementSystemTest > test-output.txt
        cat test-output.txt

    - name: Generate JUnit XML Report
      run: |
        ant -f build.xml test -Dlibs.junit_4.classpath="lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" || true

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          build/test/results/*.xml
          build/test/results/TEST-*.xml
          **/TEST-*.xml